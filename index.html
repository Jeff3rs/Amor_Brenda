<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flores amarillas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="stage" id="stage">

    <div class="garden" id="garden" aria-hidden="true"></div>

    <svg class="suelo" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 62 C180 22 360 96 560 58 C760 20 940 96 1140 54 C1270 28 1370 50 1440 60 L1440 120 L0 120 Z"/>
    </svg>

    <!-- Todo el texto se cambia desde CONFIG en script.js -->
    <section class="intro">
      <p class="fecha" id="fecha"></p>
      <h1 id="titulo"></h1>
      <p class="lead" id="intro"></p>

      <div class="card">
        <p class="dedicatoria" id="dedicatoria" aria-live="polite"></p>
        <p class="firma" id="firma"></p>
        <div class="acciones">
          <button type="button" id="mas"></button>
        </div>
        <p class="pista" id="pista"></p>
      </div>
    </section>

    <!-- Mariposas amarillas -->
    <div class="mariposa" style="--dur:30s; --ret:-4s; --escala:1" aria-hidden="true">
      <svg viewBox="0 0 40 30"><g class="alas"><path d="M20 15 C16 3 4 0 3 8 C2 15 12 18 20 15Z"/><path d="M20 15 C24 3 36 0 37 8 C38 15 28 18 20 15Z"/><path d="M20 15 C12 17 5 22 8 27 C13 29 19 23 20 15Z"/><path d="M20 15 C28 17 35 22 32 27 C27 29 21 23 20 15Z"/></g><ellipse cx="20" cy="15" rx="1.4" ry="7" fill="#5b3a14"/></svg>
    </div>
    <div class="mariposa alterna" style="--dur:38s; --ret:-16s; --escala:.8" aria-hidden="true">
      <svg viewBox="0 0 40 30"><g class="alas"><path d="M20 15 C16 3 4 0 3 8 C2 15 12 18 20 15Z"/><path d="M20 15 C24 3 36 0 37 8 C38 15 28 18 20 15Z"/><path d="M20 15 C12 17 5 22 8 27 C13 29 19 23 20 15Z"/><path d="M20 15 C28 17 35 22 32 27 C27 29 21 23 20 15Z"/></g><ellipse cx="20" cy="15" rx="1.4" ry="7" fill="#5b3a14"/></svg>
    </div>
    <div class="mariposa" style="--dur:46s; --ret:-30s; --escala:.65" aria-hidden="true">
      <svg viewBox="0 0 40 30"><g class="alas"><path d="M20 15 C16 3 4 0 3 8 C2 15 12 18 20 15Z"/><path d="M20 15 C24 3 36 0 37 8 C38 15 28 18 20 15Z"/><path d="M20 15 C12 17 5 22 8 27 C13 29 19 23 20 15Z"/><path d="M20 15 C28 17 35 22 32 27 C27 29 21 23 20 15Z"/></g><ellipse cx="20" cy="15" rx="1.4" ry="7" fill="#5b3a14"/></svg>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
